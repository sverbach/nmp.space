			.stage {
				position: relative;
				min-height: 100vh;
				overflow: hidden;
			}

			/* clipping frame for the rotated pattern */
			.pattern {
				position: absolute;
				inset: 0;
				overflow: hidden;
			}

			/* oversized square, rotated 45deg so the checkers read as diamonds and the
     background-position scroll (local +x) reads as top-left -> bottom-right */
			.pattern::before {
				content: "";
				position: absolute;
				top: 50%;
				left: 50%;
				width: 300vmax;
				height: 300vmax;
				transform: translate(
						-50%,
						-50%
					)
					rotate(
						45deg
					);
				background-image: conic-gradient(
					var(
							--ink
						)
						0
						25%,
					#fff
						0
						50%,
					var(
							--ink
						)
						0
						75%,
					#fff
						0
				);
				background-size: var(
						--tile
					)
					var(
						--tile
					);
				animation: drift
					var(
						--duration
					)
					linear
					infinite;
				will-change: background-position;
			}

			@keyframes drift {
				from {
					background-position: 0
						0;
				}
				to {
					background-position: var(
							--period
						)
						0;
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.pattern::before {
					animation: none;
				}
			}
